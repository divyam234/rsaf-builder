name: Rebuild RSAF

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream RSAF tag to build (for example v4.9). Leave empty for latest release.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rebuild-rsaf
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: chenxiaolong/RSAF
      RCLONE_REPO: divyam234/rclone-private

    steps:
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            tag="$REQUESTED_TAG"
            gh api "repos/${UPSTREAM_REPO}/releases/tags/${tag}" >/tmp/upstream-release.json
          else
            gh api "repos/${UPSTREAM_REPO}/releases/latest" >/tmp/upstream-release.json
            tag="$(jq -r '.tag_name' /tmp/upstream-release.json)"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name // .tag_name' /tmp/upstream-release.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' /tmp/upstream-release.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream RSAF
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: chenxiaolong/RSAF
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Check out private rclone
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: divyam234/rclone-private
          ref: main
          path: rclone-private
          token: ${{ secrets.RCLONE_REPO_TOKEN }}
          fetch-depth: 1

      - name: Validate required secrets
        if: steps.existing.outputs.exists != 'true'
        env:
          RCLONE_REPO_TOKEN: ${{ secrets.RCLONE_REPO_TOKEN }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RSAF_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSPHRASE: ${{ secrets.RSAF_RELEASE_KEYSTORE_PASSPHRASE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RSAF_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSPHRASE: ${{ secrets.RSAF_RELEASE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          for name in \
            RCLONE_REPO_TOKEN \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSPHRASE \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSPHRASE; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Set up JDK 21
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Replace upstream rclone with private source
        if: steps.existing.outputs.exists != 'true'
        working-directory: upstream/rcbridge
        run: |
          set -euo pipefail
          go mod edit -replace="github.com/rclone/rclone=${GITHUB_WORKSPACE}/rclone-private"
          go mod edit -json | jq -e --arg dir "${GITHUB_WORKSPACE}/rclone-private" '.Replace[] | select(.Old.Path == "github.com/rclone/rclone" and .New.Dir == $dir)' >/dev/null

      - name: Restore release keystore
        if: steps.existing.outputs.exists != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RSAF_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rsaf-release.jks"
          chmod 600 "$RUNNER_TEMP/rsaf-release.jks"

      - name: Build signed release APKs
        if: steps.existing.outputs.exists != 'true'
        working-directory: upstream
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/rsaf-release.jks
          RELEASE_KEYSTORE_PASSPHRASE: ${{ secrets.RSAF_RELEASE_KEYSTORE_PASSPHRASE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RSAF_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSPHRASE: ${{ secrets.RSAF_RELEASE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Collect release files
        if: steps.existing.outputs.exists != 'true'
        id: artifacts
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          find upstream/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp '{}' release-files/ ';'

          count="$(find release-files -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo 'No release APKs were produced.' >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum ./*.apk > SHA256SUMS
          )

          echo "rclone_sha=$(git -C rclone-private rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rsaf_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish builder release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.release.outputs.name }}
          UPSTREAM_URL: ${{ steps.release.outputs.url }}
          RSAF_SHA: ${{ steps.artifacts.outputs.rsaf_sha }}
          RCLONE_SHA: ${{ steps.artifacts.outputs.rclone_sha }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Rebuilt from upstream RSAF release **${UPSTREAM_NAME}** using the private rclone source.

          - Upstream release: ${UPSTREAM_URL}
          - RSAF commit: \`${RSAF_SHA}\`
          - rclone commit: \`${RCLONE_SHA}\`

          APKs are signed with this builder repository's configured release key. `SHA256SUMS` contains checksums for all APKs.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RSAF ${TAG} (private rclone)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release-files/*
