name: Rebuild RSAF

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream RSAF tag to build (for example v4.9). Leave empty for latest release.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rebuild-rsaf
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: chenxiaolong/RSAF
      RCLONE_REPO: divyam234/rclone-private

    steps:
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            tag="$REQUESTED_TAG"
            gh api "repos/${UPSTREAM_REPO}/releases/tags/${tag}" >/tmp/upstream-release.json
          else
            gh api "repos/${UPSTREAM_REPO}/releases/latest" >/tmp/upstream-release.json
            tag="$(jq -r '.tag_name' /tmp/upstream-release.json)"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name // .tag_name' /tmp/upstream-release.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' /tmp/upstream-release.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream RSAF
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: chenxiaolong/RSAF
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Check out private rclone
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: divyam234/rclone-private
          ref: main
          path: rclone-private
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Validate private repo token
        if: steps.existing.outputs.exists != 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN:-}" ]]; then
            echo "Missing required secret: PAT_TOKEN" >&2
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Replace upstream rclone with private source
        if: steps.existing.outputs.exists != 'true'
        working-directory: upstream/rcbridge
        run: |
          set -euo pipefail
          printf '\nreplace github.com/rclone/rclone => %s\n' "${GITHUB_WORKSPACE}/rclone-private" >> go.mod
          printf '\ntool golang.org/x/mobile/cmd/gobind\ntool golang.org/x/mobile/cmd/gomobile\n' >> go.mod
          grep -F "replace github.com/rclone/rclone => ${GITHUB_WORKSPACE}/rclone-private" go.mod >/dev/null
          grep -F 'tool golang.org/x/mobile/cmd/gobind' go.mod >/dev/null
          grep -F 'tool golang.org/x/mobile/cmd/gomobile' go.mod >/dev/null

      - name: Create Android debug keystore
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/rsaf-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build release APKs signed with debug key
        if: steps.existing.outputs.exists != 'true'
        working-directory: upstream
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/rsaf-debug.jks
          RELEASE_KEYSTORE_PASSPHRASE: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSPHRASE: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Collect release files
        if: steps.existing.outputs.exists != 'true'
        id: artifacts
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          find upstream/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp '{}' release-files/ ';'

          count="$(find release-files -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo 'No release APKs were produced.' >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum ./*.apk > SHA256SUMS
          )

          echo "rclone_sha=$(git -C rclone-private rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rsaf_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish builder release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.release.outputs.name }}
          UPSTREAM_URL: ${{ steps.release.outputs.url }}
          RSAF_SHA: ${{ steps.artifacts.outputs.rsaf_sha }}
          RCLONE_SHA: ${{ steps.artifacts.outputs.rclone_sha }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Rebuilt from upstream RSAF release **${UPSTREAM_NAME}** using the private rclone source.

          - Upstream release: ${UPSTREAM_URL}
          - RSAF commit: \`${RSAF_SHA}\`
          - rclone commit: \`${RCLONE_SHA}\`

          APKs are release builds signed with the standard Android debug key credentials generated by the workflow. `SHA256SUMS` contains checksums for all APKs.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RSAF ${TAG} (private rclone)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release-files/*
